# Dependabot configuration.
#
# Dependabot opens dependency-update PRs against the default branch (main),
# where they flow through the same gate as every other change:
# PR → pr-validate (+ GitGuardian) → auto-merge → deploy.
#
# HISTORY / why no `target-branch`: this file used to set
# `target-branch: develop` to protect the old `feature/latest2 → develop → main`
# fast-forward chain that `/ship` relied on. That branch model was retired
# 2026-05-10 (develop deleted); the chain no longer exists. The dangling
# `target-branch: develop` then pointed Dependabot at a non-existent branch,
# which silently stopped it from opening PRs (last Dependabot PR: 2026-05-19).
# Removing it (2026-05-30) restores Dependabot against `main`.
#
# Note: Dependabot's `pip` ecosystem reads pyproject.toml, not uv.lock — after
# merging a bump, regenerate the lock with `uv lock` / `uv sync` so deploy.yml's
# `uv sync --frozen` on the VPS resolves cleanly.

version: 2
updates:

  # Python dependencies (uv / pyproject.toml)
  # Dependabot's pip ecosystem reads pyproject.toml directly. It does not
  # natively understand uv.lock; users merging Dependabot's PRs must run
  # `uv sync` (or `uv lock --upgrade-package <name>`) to refresh the lock
  # before deployment. The dependencies install via uv on the production
  # VPS in deploy.yml, so the lockfile must be regenerated locally.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
      timezone: "America/Chicago"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Group security updates separately so they can be expedited if needed
    groups:
      python-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
      timezone: "America/Chicago"
    labels:
      - "dependencies"
      - "ci-cd"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"

  # web-ui (Next.js dashboard) npm dependencies. Added 2026-07-30: the JS tree
  # previously got NO version-update PRs (only GitHub's automatic
  # security-update path), which is why it drifted until Dependabot alerts
  # fired (postcss/sharp/brace-expansion, 2026-07).
  - package-ecosystem: "npm"
    directory: "/web-ui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "12:00"
      timezone: "America/Chicago"
    labels:
      - "dependencies"
      - "web-ui"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    # Majors that need a hand-written migration are held back here, because the
    # deploy pipeline gives a breaking web-ui build nowhere to surface EXCEPT
    # production: pr-validate runs py_compile/ruff/pytest and does NOT build
    # web-ui, so an npm major passes the only pre-deploy gate green and then fails
    # on the VPS inside deploy-production.
    #
    # tailwindcss 3 -> 4 (#1649, merged 2026-08-03) did exactly that. v4 moved its
    # PostCSS plugin to `@tailwindcss/postcss`; this project loads `tailwindcss`
    # directly in web-ui/postcss.config.mjs. Every deploy to production failed for
    # the next THREE DAYS (runs 30836231632 through 31099494601) and the automated
    # "Re-run transient deploy failure (once)" retry masked it, because a version
    # mismatch re-runs identically and the retry job itself still reported success.
    # Reverted to ^3.4.19 in this PR.
    #
    # A v4 migration is real work — CSS-first `@theme` config, `@import
    # "tailwindcss"` replacing the three `@tailwind` directives, and re-checking
    # every shadcn token in tailwind.config.ts — and it must be done deliberately,
    # not merged as a dependency bump at 12:00 on a Monday. Remove this ignore in
    # the same PR that does the migration.
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
